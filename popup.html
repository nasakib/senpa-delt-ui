<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Senpa UI Mod</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-brand">
        <span class="popup-logo">S</span>
        <div>
          <div class="popup-title">SENPA<span class="popup-accent">.IO</span></div>
          <div class="popup-version">Enhanced Mod v2.0</div>
        </div>
      </div>
      <div class="popup-badge">MV3</div>
    </div>

    <div class="popup-body">
      <div class="popup-row">
        <span>Mod Enabled</span>
        <label class="popup-switch">
          <input type="checkbox" id="mod-active-toggle" checked>
          <span class="popup-slider"></span>
        </label>
      </div>

      <div class="popup-divider"></div>

      <div class="popup-section-title">QUICK ACCENT THEME</div>
      <div class="popup-swatches" id="popup-swatches">
        <button class="popup-swatch" style="background:#fe70c3" data-color="#fe70c3" title="Pink"></button>
        <button class="popup-swatch" style="background:#00f2fe" data-color="#00f2fe" title="Cyan"></button>
        <button class="popup-swatch" style="background:#a855f7" data-color="#a855f7" title="Purple"></button>
        <button class="popup-swatch" style="background:#10b981" data-color="#10b981" title="Emerald"></button>
        <button class="popup-swatch" style="background:#f59e0b" data-color="#f59e0b" title="Gold"></button>
      </div>

      <div class="popup-divider"></div>

      <a href="https://senpa.io/web/" target="_blank" class="popup-play-link">
        ▶ Launch Senpa.io
      </a>
    </div>

    <div class="popup-footer">
      <span>Senpa.io Enhanced Client</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
